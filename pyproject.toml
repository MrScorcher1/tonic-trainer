[project]
name = "tonic-trainer"
version = "0.1.0"
description = "Local-first, stateless ear-training web app over the FMA/FMAK keyed corpus"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mutagen>=1.47",
    "librosa>=0.10",
    "qrcode>=7.4",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
